name: Sync with upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git remote add upstream https://github.com/giper-dev/baza.git
        git fetch upstream
        AHEAD=$(git log HEAD..upstream/master --oneline | wc -l)
        echo "Upstream ahead: $AHEAD"
        if [ "$AHEAD" -gt 0 ]; then
          git merge upstream/master --no-edit || exit 1
          git push origin master
        fi
